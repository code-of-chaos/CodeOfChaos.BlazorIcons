name: "CI: Release"

on:
    workflow_dispatch:
        inputs:
            part:
                description: "Version part to bump"
                required: false
                default: none
                type: choice
                options:
                    - none
                    - major
                    - minor
                    - patch
                    - preview
            custom_version:
                description: "Explicit version override (example: 1.14.1 or 1.14.1-preview.1)"
                required: false
                type: string
            publish_to_nuget:
                description: "Publish packages to NuGet.org and GitHub Packages"
                required: false
                default: true
                type: boolean

permissions:
    contents: write
    packages: write
    id-token: write

jobs:
    testing:
        # noinspection UndefinedAction
        uses: ./.github/workflows/shared-testing.yml
        secrets: inherit

    publish:
        runs-on: ubuntu-latest
        needs: testing
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.CI_RELEASE_TOKEN }}

            -   name: Resolve version bump inputs
                id: bump-inputs
                run: |
                    if [ -n "${{ inputs.custom_version }}" ]; then
                      echo "bump=custom" >> "$GITHUB_OUTPUT"
                      echo "custom_version=${{ inputs.custom_version }}" >> "$GITHUB_OUTPUT"
                    elif [ -n "${{ inputs.part }}" ] && [ "${{ inputs.part }}" != "none" ]; then
                      echo "bump=${{ inputs.part }}" >> "$GITHUB_OUTPUT"
                      echo "custom_version=" >> "$GITHUB_OUTPUT"
                    else
                      LUCIDE_VERSION="$(sed -n 's/.*"lucide-static": *"\([^"]*\)".*/\1/p' src/CodeOfChaos.BlazorIcons.Lucide/package.json)"
                      echo "No inputs provided. Using lucide-static version: $LUCIDE_VERSION"
                      echo "bump=custom" >> "$GITHUB_OUTPUT"
                      echo "custom_version=$LUCIDE_VERSION" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Bump version
                id: version
                uses: Code-Of-Chaos/action-version-bumper@v2
                with:
                    version_file: src/Directory.Build.props
                    bump: ${{ steps.bump-inputs.outputs.bump }}
                    custom_version: ${{ steps.bump-inputs.outputs.custom_version }}
                    commit: 'true'
                    tag: 'true'
                    push: 'true'

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 26
                    cache: npm
                    cache-dependency-path: src/CodeOfChaos.BlazorIcons.Lucide/package-lock.json

            -   name: Install dependencies
                run: npm install
                working-directory: ${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 11.x

            -   name: Export node_modules path
                run: |
                    echo "NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules" >> $GITHUB_ENV
                    export NODE_PATH=${{ github.workspace }}/src/CodeOfChaos.BlazorIcons.Lucide/node_modules

            -   name: Restore NuGet packages
                run: dotnet restore CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf

            -   name: Build projects
                run: dotnet build CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf --configuration Release --no-restore

            -   name: Pack
                run: dotnet pack CodeOfChaos.BlazorIcons.GitHubActions.Release.slnf --configuration Release -o ./release

            -   name: Upload NuGet Artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: nuget-packages-${{ steps.version.outputs.tag }}
                    path: ./release/*.nupkg

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    token: ${{ secrets.CI_RELEASE_TOKEN }}
                    tag_name: ${{ steps.version.outputs.tag }}
                    name: Release ${{ steps.version.outputs.version }}
                    generate_release_notes: true
                    files: ./release/*.nupkg
                    prerelease: ${{ contains(steps.version.outputs.version, 'preview') }}

            -   name: NuGet login (OIDC → temp API key)
                uses: NuGet/login@v1
                id: login
                with:
                    user: ${{ secrets.NUGET_USER }}
                  
            -   name: Push to NuGet
                if: ${{ inputs.publish_to_nuget }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate

            -   name: Push GitHub Packages
                if: ${{ inputs.publish_to_nuget }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "${{ secrets.GITHUB_TOKEN }}" \
                      --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                      --skip-duplicate
